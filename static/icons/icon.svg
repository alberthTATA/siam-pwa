<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer frame (Aluminio) -->
  <rect x="76" y="76" width="360" height="360" rx="24" fill="none" stroke="#94A3B8" stroke-width="8" stroke-opacity="0.6" />

  <!-- Glass sheet panel -->
  <rect x="96" y="96" width="320" height="320" rx="16" fill="url(#glassGrad)" stroke="#E0F2FE" stroke-width="3" />

  <!-- Cutting pattern grid lines (Bin packing visualization) -->
  <!-- Piece A -->
  <rect x="116" y="116" width="160" height="180" rx="8" fill="#0284C7" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="3" />
  <text x="196" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P1</text>

  <!-- Piece B -->
  <rect x="292" y="116" width="104" height="110" rx="8" fill="#0369A1" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="3" />
  <text x="344" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P2</text>

  <!-- Piece C -->
  <rect x="292" y="242" width="104" height="154" rx="8" fill="#075985" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="3" />
  <text x="344" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P3</text>

  <!-- Piece D -->
  <rect x="116" y="312" width="80" height="84" rx="8" fill="#0284C7" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="3" />
  <text x="156" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P4</text>

  <!-- Defect obstacle zone (detected bubble/scratch avoided) -->
  <rect x="210" y="318" width="66" height="74" rx="6" fill="#EF4444" fill-opacity="0.7" stroke="#F87171" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="243" cy="355" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <line x1="235" y1="347" x2="251" y2="363" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />
  <line x1="251" y1="347" x2="235" y2="363" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />

  <!-- Smart Scanner Crosshair & Beam (AI vision indicator) -->
  <path d="M 60 256 L 452 256" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />
  <circle cx="243" cy="256" r="38" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="8,6" />

  <!-- Corner Targeting Reticles -->
  <path d="M 86 116 L 86 86 L 116 86" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <path d="M 426 116 L 426 86 L 396 86" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <path d="M 86 396 L 86 426 L 116 426" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <path d="M 426 396 L 426 426 L 396 426" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

  <!-- SIAM Label Badge -->
  <g transform="translate(256, 464)">
    <rect x="-100" y="-24" width="200" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <text x="0" y="-1" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#38BDF8" text-anchor="middle">SIAM</text>
  </g>
</svg>
